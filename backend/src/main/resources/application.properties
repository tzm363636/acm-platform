spring.application.name=acm-platform-backend
server.port=${PORT:10000}
server.address=0.0.0.0
# No database is assumed. Activate mysql-local or aiven explicitly.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
spring.flyway.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
spring.jackson.time-zone=UTC
spring.jackson.deserialization.fail-on-unknown-properties=true
logging.level.org.springframework.jdbc=OFF
logging.level.com.zaxxer.hikari=WARN
logging.level.org.flywaydb=WARN
logging.level.org.springframework.boot.SpringApplication=OFF
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
acm.admin.username=${ADMIN_USERNAME:}
acm.admin.password=${ADMIN_PASSWORD:}
acm.admin.display-name=${ADMIN_DISPLAY_NAME:站点管理员}

spring.application.name=acm-platform-backend
server.port=${PORT:10000}
server.address=0.0.0.0
# No database is assumed. Activate mysql-local or aiven explicitly.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
spring.flyway.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
spring.jackson.time-zone=UTC
spring.jackson.deserialization.fail-on-unknown-properties=true
logging.level.org.springframework.jdbc=OFF
logging.level.com.zaxxer.hikari=WARN
logging.level.org.flywaydb=WARN
logging.level.org.springframework.boot.SpringApplication=OFF

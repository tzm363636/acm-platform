spring.config.import=classpath:database.properties
server.port=${PORT:8080}
server.address=127.0.0.1
acm.db.environment=development
# Plain local transport is an explicit local-only choice, never an Aiven fallback.
acm.db.ssl-mode=${DB_SSL_MODE:VERIFY_IDENTITY}
acm.db.expected-major=${DB_EXPECTED_MAJOR:8}
acm.db.pool-max=${DB_POOL_MAX:4}
acm.db.demo-enabled=${DB_DEMO_ENABLED:false}
